name: Log Analyzer CI-CD
# ==========================================
# PIPELINE TRIGGERS
# ==========================================

on:
  push:
    branches: main


# ==========================================
# JOBS
# ==========================================

jobs:


  # ========================================
  # CI - AUTOMATED TESTING
  # ========================================

  test:

    name: Automated Tests

    runs-on: self-hosted

    steps:

      # --------------------------------------
      # Checkout source code
      # --------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4
      
      #--------------------------------------------------
      # Setup Prometheus and Grafana using Terraform
      #--------------------------------------------------
      # - name: Setup Prometheus and Grafana using Terraform
      #   uses: hashicorp/setup-terraform@v3
      
      # - name: Check Docker
      #   run: docker version

      # - name: Check Terraform
      #   run: terraform version

      # - name: Terraform Init
      #   run: terraform init

      # - name: Terraform Plan
      #   run: terraform plan

      # - name: Terraform Apply
      #   run: terraform apply -auto-approve

      # - name: Verify containers
      #   run: docker ps
      
      # -------------------------------------------------
      # Setup Prometheus and Grafana using Docker Compose
      # -------------------------------------------------
      - name: Set up Prometheus and Grafana using Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d

      - name: Wait for Prometheus and Grafana to be ready
        run: |
          echo "Waiting for Prometheus and Grafana to be ready..."
          sleep 20  # Adjust the sleep duration as needed
      
      - name: Show running Docker containers
        run: |
          docker ps

      - name: Verify Prometheus and Grafana
        run: |
          echo "Verifying Prometheus and Grafana..."
          curl -f http://localhost:9090 || { echo "Prometheus is not running"; exit 1; }
          curl -f http://localhost:3000 || { echo "Grafana is not running"; exit 1; }

      # --------------------------------------
      # Setup Python
      # --------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------
      # Install dependencies
      # --------------------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------
      # Run automated tests
      # --------------------------------------

      - name: Run Automated Tests
        run: |
          pytest -v

  # ========================================
  # CI - Static Code Analysis
  # ========================================
  sonarqube:
    name: SonarQube
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
            fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ========================================
  # CD - BUILD AND DEPLOY
  # ========================================

  deploy:

    name: Build and Deploy

    needs: sonarqube

    # Self-hosted runner is used because
    # Docker container must remain running
    runs-on: self-hosted

    steps:


      # --------------------------------------
      # Checkout source code
      # --------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------
      # Build Docker Image
      # --------------------------------------

      - name: Build Docker Image
        run: |
          docker build -t log-analyzer:latest .


      # --------------------------------------
      # Terraform Init
      # --------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init


      # --------------------------------------
      # Terraform Validate
      # --------------------------------------

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate


      # --------------------------------------
      # Terraform Plan
      # --------------------------------------

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan


      # --------------------------------------
      # Terraform Apply
      # --------------------------------------

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve


      # --------------------------------------
      # Verify Deployment
      # --------------------------------------

      - name: Verify Docker Container
        run: |
          docker ps

          echo "Log Analyzer deployment completed successfully."

      # --------------------------------------
      # Verify Deployment & Check Output
      # --------------------------------------

      # Give the container 3 seconds to boot up and print its initial report
      #- name: Wait for application startup
      #  run: sleep 3

      #- name: View Log Analyzer Output
      #  run: |
      #    echo "=== FETCHING CONTAINER OUTPUT ==="
      #    docker logs log-analyzer
      #    echo "================================="

